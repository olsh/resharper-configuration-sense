name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packages to JetBrains Marketplace and create the GitHub release
        type: boolean
        default: false

concurrency:
  # A dispatched release gets a group to itself, keyed on the run, so that a push landing while it
  # publishes cannot cancel it half way through. Push and pull request runs keep superseding theirs
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build:
    # This name is master's required status check, so Dependabot auto-merge waits for a
    # green build instead of merging straight away. Renaming the job without updating the
    # branch protection rule blocks every pull request, because the check never reports.
    name: Build and test
    runs-on: windows-2025

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Java
        # Gradle compiles the Rider frontend against Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            build.gradle
            settings.gradle
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties

      - name: Validate solution
        run: dotnet sln Resharper.ConfigurationSense.slnx list

      - name: Run tests
        run: .\build.cmd Test --configuration Release

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test/results/*.xml
          if-no-files-found: error

      - name: Build and pack
        run: .\build.cmd PackResharper PackRider --configuration Release

      - name: Upload ReSharper package
        uses: actions/upload-artifact@v7
        with:
          name: resharper-package-${{ env.EXTENSION_VERSION }}
          path: Resharper.ConfigurationSense.${{ env.EXTENSION_VERSION }}.nupkg
          if-no-files-found: error

      - name: Upload Rider package
        uses: actions/upload-artifact@v7
        with:
          name: rider-package-${{ env.EXTENSION_VERSION }}
          path: gradle-build/distributions/rider-configuration-sense-${{ env.EXTENSION_VERSION }}.zip
          if-no-files-found: error

      # The pack targets export EXTENSION_VERSION into the job environment, which the release job
      # cannot see, so hand it over as a job output instead
      - name: Expose extension version
        id: version
        run: echo "value=$env:EXTENSION_VERSION" >> $env:GITHUB_OUTPUT

      - name: Publish to JetBrains Marketplace
        if: inputs.publish
        env:
          MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: .\build.cmd PublishReSharperPlugin PublishRiderPlugin --configuration Release

  release:
    name: Create GitHub release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Tag the commit and publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::The build job did not report an extension version"
            exit 1
          fi

          # EAP builds carry a prerelease suffix, for example 2025.1.0.373-eap02
          case "$VERSION" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac

          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes $prerelease
